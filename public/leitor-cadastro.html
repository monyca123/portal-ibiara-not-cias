<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibiara Notícias — Criar conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 420px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1 text-center">📰 Ibiara Notícias</h1>
        <p class="text-muted text-center mb-4">Criar conta para comentar</p>

        <div id="alerta-erro" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-cadastro">
          <div class="mb-3">
            <label for="cad-nome" class="form-label">Nome</label>
            <input id="cad-nome" type="text" class="form-control" name="nome" required autofocus />
          </div>
          <div class="mb-3">
            <label for="cad-email" class="form-label">Email</label>
            <input id="cad-email" type="email" class="form-control" name="email" required />
          </div>
          <div class="mb-3">
            <label for="cad-senha" class="form-label">Senha</label>
            <input id="cad-senha" type="password" class="form-control" name="senha" minlength="6" required />
            <div class="form-text">Pelo menos 6 caracteres.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="btn-cadastrar">Criar conta</button>
        </form>

        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1" /><span class="px-2 text-muted small">ou</span><hr class="flex-grow-1" />
        </div>

        <a id="link-google" href="#" class="btn btn-outline-dark w-100">Continuar com Google</a>

        <p class="text-center mt-3 mb-0">
          Já tem conta? <a id="link-entrar" href="leitor-entrar.html">Entrar</a>
        </p>
        <p class="text-center mt-2"><a href="index.html">&larr; Voltar ao portal</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/leitor-cadastro.js"></script>
</body>
</html>
