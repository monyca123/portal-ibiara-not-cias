<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibiara Notícias — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 420px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1 text-center">📰 Ibiara Notícias</h1>
        <p class="text-muted text-center mb-4">Área do jornalista</p>

        <div id="alerta-erro" class="alert alert-danger d-none"></div>

        <form id="form-login">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" name="senha" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <p class="small text-muted mt-3 mb-0 text-center">
          Demo: admin@ibiaranoticias.com.br / admin123<br />
          ou maria@ibiaranoticias.com.br / autora123
        </p>
        <p class="text-center mt-3"><a href="index.html">&larr; Voltar ao portal</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
