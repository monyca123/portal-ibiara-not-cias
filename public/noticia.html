<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibiara Notícias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">📰 Ibiara Notícias</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Voltar</a>
    </div>
  </nav>

  <main class="container my-5">
    <article id="noticia-conteudo">
      <div class="text-center text-muted py-5">Carregando notícia...</div>
    </article>

    <hr class="my-5" />

    <section id="secao-comentarios">
      <h4>Comentários</h4>
      <div id="lista-comentarios" class="mb-4"></div>

      <form id="form-comentario" class="card card-body">
        <div class="mb-3">
          <label class="form-label">Seu nome</label>
          <input type="text" class="form-control" name="autorNome" placeholder="Anônimo" />
        </div>
        <div class="mb-3">
          <label class="form-label">Comentário</label>
          <textarea class="form-control" name="texto" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar comentário</button>
      </form>
    </section>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container text-center small">
      Ibiara Notícias &copy; 2026 — Projeto acadêmico de Programação Web (UEPB).
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/noticia.js"></script>
</body>
</html>
