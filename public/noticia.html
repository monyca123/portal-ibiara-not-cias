<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibiara Notícias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">📰 Ibiara Notícias</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Voltar</a>
    </div>
  </nav>

  <main class="container my-5">
    <article id="noticia-conteudo">
      <div class="text-center text-muted py-5">Carregando notícia...</div>
    </article>

    <hr class="my-5" />

    <section id="secao-comentarios">
      <h4>Comentários</h4>
      <div id="lista-comentarios" class="mb-4" aria-live="polite"></div>

      <div id="prompt-login" class="alert alert-secondary d-none">
        Você precisa <a id="link-entrar" href="leitor-entrar.html">entrar</a> ou
        <a id="link-cadastro" href="leitor-cadastro.html">criar uma conta</a> para comentar.
      </div>

      <form id="form-comentario" class="card card-body d-none">
        <p class="small text-muted mb-2">Comentando como <strong id="comentario-usuario"></strong></p>
        <div class="mb-3">
          <label for="comentario-texto" class="form-label">Comentário</label>
          <textarea id="comentario-texto" class="form-control" name="texto" rows="3" required></textarea>
        </div>
        <div id="comentario-erro" class="alert alert-danger d-none" role="alert"></div>
        <button type="submit" class="btn btn-primary" id="btn-enviar-comentario">Enviar comentário</button>
      </form>
    </section>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container text-center small">
      Ibiara Notícias &copy; 2026 — Projeto acadêmico de Programação Web (UEPB).
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/noticia.js"></script>
</body>
</html>
