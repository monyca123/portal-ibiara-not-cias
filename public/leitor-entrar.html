<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibiara Notícias — Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 420px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1 text-center">📰 Ibiara Notícias</h1>
        <p class="text-muted text-center mb-4">Entrar para comentar</p>

        <div id="alerta-erro" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-login">
          <div class="mb-3">
            <label for="entrar-email" class="form-label">Email</label>
            <input id="entrar-email" type="email" class="form-control" name="email" required autofocus />
          </div>
          <div class="mb-3">
            <label for="entrar-senha" class="form-label">Senha</label>
            <input id="entrar-senha" type="password" class="form-control" name="senha" required />
          </div>
          <button type="submit" class="btn btn-primary w-100" id="btn-entrar">Entrar</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Não tem conta? <a id="link-cadastro" href="leitor-cadastro.html">Criar conta</a>
        </p>
        <p class="text-center mt-2"><a href="index.html">&larr; Voltar ao portal</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/leitor-entrar.js"></script>
</body>
</html>
