<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibiara Notícias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">📰 Ibiara Notícias</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#" data-filtro-tipo="">Todas</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-filtro-tipo="local">Local</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-filtro-tipo="geral">Geral</a></li>
        </ul>
        <a href="admin.html" class="btn btn-outline-light btn-sm">Área do jornalista</a>
      </div>
    </div>
  </nav>

  <header class="bg-primary text-white py-4 mb-4">
    <div class="container">
      <h1 class="h3 mb-1">Ibiara Notícias</h1>
      <p class="mb-0">Notícias locais de Ibiara/PB e do Brasil, sempre atualizadas.</p>
    </div>
  </header>

  <main class="container mb-5">
    <div class="d-flex flex-wrap gap-2 mb-4" id="filtros-categoria">
      <button class="btn btn-sm btn-outline-secondary ativo" data-categoria-id="">Todas as categorias</button>
    </div>

    <div id="lista-noticias" class="row g-4">
      <div class="col-12 text-center text-muted py-5">Carregando notícias...</div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container text-center small">
      Ibiara Notícias &copy; 2026 — Projeto acadêmico de Programação Web (UEPB).
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
